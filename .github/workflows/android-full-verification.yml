name: DevxyzIDE Full Android Verification

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build and verify installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17 for Android SDK tools and host tests
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-28" \
            "build-tools;28.0.3"

      - name: Run host and runtime compatibility tests
        shell: bash
        run: sh host-tests/run.sh

      - name: Set up JDK 8 for legacy Gradle and AGP
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle 4.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.6'

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace clean assembleDebug 2>&1 | tee gradle-build.log

      - name: Upload Gradle diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DevxyzIDE-gradle-build-log
          path: gradle-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Verify APK package, signature, integrity, and ABI portability
        shell: bash
        run: |
          set -euxo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          "${ANDROID_SDK_ROOT}/build-tools/28.0.3/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -F "package: name='com.jepongdevxyz.idebuild'" apk-badging.txt
          "${ANDROID_SDK_ROOT}/build-tools/28.0.3/apksigner" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          grep -F "Verifies" apk-signature.txt
          if unzip -Z1 "$APK" | grep -q '^lib/'; then
            echo "Native libraries detected; ABI-specific validation is required."
            unzip -Z1 "$APK" | grep '^lib/'
            exit 1
          fi
          echo "No native libraries: APK is architecture-neutral for ARM64/x86_64 package installation." | tee apk-abi.txt
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: DevxyzIDE-v0.6-modern-device-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-badging.txt
            apk-signature.txt
            apk-abi.txt
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 14

  emulator-api28:
    name: Install and launch on Android 9 (API 28)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: DevxyzIDE-v0.6-modern-device-apk
          path: verified-artifact
      - name: Install and launch on API 28
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics
          script: |
            set -euxo pipefail
            APK="$(find verified-artifact -type f -name 'app-debug.apk' -print -quit)"
            test -s "$APK"
            adb wait-for-device
            adb install -r "$APK" | tee install-api28.txt
            grep -F "Success" install-api28.txt
            adb shell pm list packages | grep -F "package:com.jepongdevxyz.idebuild"
            adb shell monkey -p com.jepongdevxyz.idebuild -c android.intent.category.LAUNCHER 1
            sleep 5
            adb shell dumpsys activity activities | grep -F "com.jepongdevxyz.idebuild/.MainActivity"

  emulator-modern:
    name: Install and launch on Android 15 (API 35)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: DevxyzIDE-v0.6-modern-device-apk
          path: verified-artifact
      - name: Install and launch on API 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics
          script: |
            set -euxo pipefail
            APK="$(find verified-artifact -type f -name 'app-debug.apk' -print -quit)"
            test -s "$APK"
            adb wait-for-device
            adb install -r "$APK" | tee install-api35.txt
            grep -F "Success" install-api35.txt
            adb shell pm list packages | grep -F "package:com.jepongdevxyz.idebuild"
            adb shell monkey -p com.jepongdevxyz.idebuild -c android.intent.category.LAUNCHER 1
            sleep 5
            adb shell dumpsys activity activities | grep -F "com.jepongdevxyz.idebuild/.MainActivity"
