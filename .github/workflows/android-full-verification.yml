name: DevxyzIDE Full Android Verification

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, release-official-signed-apk ]

permissions:
  contents: read

jobs:
  build:
    name: Build APK with Android SDK 28
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17 for Android SDK tools and host tests
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-28" "build-tools;28.0.3"

      - name: Run host tests
        run: bash host-tests/run.sh

      - name: Set up JDK 8 for legacy Android Gradle Plugin
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle 4.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.6'

      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK package
        run: |
          AAPT="$ANDROID_HOME/build-tools/28.0.3/aapt"
          "$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -F "package: name='com.jepongdevxyz.idebuild'"

      - name: Upload verified debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DevxyzIDE-reference-ui-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
