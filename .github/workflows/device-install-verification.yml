name: DevxyzIDE Device Install Verification

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  signed_device_install:
    name: Build signed APK and install on Android 15
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17 for Android SDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install build SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-28" "build-tools;28.0.3"

      - name: Set up JDK 8 for legacy Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle 4.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.6'

      - name: Build APK
        shell: bash
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Sign exact user-delivery APK
        shell: bash
        run: |
          set -euo pipefail
          RAW="app/build/outputs/apk/debug/app-debug.apk"
          SIGNED_APK="app/build/outputs/apk/debug/DevxyzIDE-v0.6.1-installable.apk"
          KEYSTORE="${RUNNER_TEMP}/devxyz-device-install.jks"
          export DEVXYZ_CI_KS_PASS="$(openssl rand -hex 16)"
          keytool -genkeypair -keystore "$KEYSTORE" \
            -storepass:env DEVXYZ_CI_KS_PASS -keypass:env DEVXYZ_CI_KS_PASS \
            -alias devxyz-device -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=DevxyzIDE Device Verification,O=Jepong Devxyz,C=PH"
          "${ANDROID_SDK_ROOT}/build-tools/28.0.3/apksigner" sign \
            --ks "$KEYSTORE" --ks-key-alias devxyz-device \
            --ks-pass env:DEVXYZ_CI_KS_PASS --key-pass env:DEVXYZ_CI_KS_PASS \
            --out "$SIGNED_APK" "$RAW"
          "${ANDROID_SDK_ROOT}/build-tools/28.0.3/apksigner" verify --verbose --print-certs "$SIGNED_APK"
          "${ANDROID_SDK_ROOT}/build-tools/28.0.3/aapt" dump badging "$SIGNED_APK" | tee device-apk-badging.txt
          grep -F "package: name='com.jepongdevxyz.idebuild' versionCode='7' versionName='0.6.1-device-install'" device-apk-badging.txt
          test -s "$SIGNED_APK"
          unzip -t "$SIGNED_APK"
          rm -f "$KEYSTORE"
          unset DEVXYZ_CI_KS_PASS

      - name: Install exact signed APK on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            SIGNED_APK="app/build/outputs/apk/debug/DevxyzIDE-v0.6.1-installable.apk"
            test -s "$SIGNED_APK"
            adb wait-for-device
            adb uninstall com.jepongdevxyz.idebuild >/dev/null 2>&1 || true
            adb install -r "$SIGNED_APK"
            adb shell pm list packages | grep -F "package:com.jepongdevxyz.idebuild"
            adb shell monkey -p com.jepongdevxyz.idebuild -c android.intent.category.LAUNCHER 1
            sleep 3
            adb shell dumpsys activity activities | grep -F "com.jepongdevxyz.idebuild"

      - name: Upload exact device-verified APK
        uses: actions/upload-artifact@v4
        with:
          name: DevxyzIDE-v0.6.1-device-install
          path: |
            app/build/outputs/apk/debug/DevxyzIDE-v0.6.1-installable.apk
            device-apk-badging.txt
          if-no-files-found: error
          retention-days: 14
