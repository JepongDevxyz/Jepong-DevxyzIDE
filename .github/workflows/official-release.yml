name: DevxyzIDE Official Signed Release

on:
  workflow_dispatch:
  push:
    branches:
      - release-official-signed-apk
    paths:
      - '.github/workflows/official-release.yml'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17 for Android SDK tools and host tests
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-28" \
            "build-tools;28.0.3"

      - name: Run host and runtime compatibility tests
        shell: bash
        run: sh host-tests/run.sh

      - name: Restore signing keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.APK_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/jepong-release.jks"
          test -s "$RUNNER_TEMP/jepong-release.jks"

      - name: Set up JDK 8 for legacy Gradle and AGP
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle 4.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.6'

      - name: Build signed release APK
        shell: bash
        env:
          STORE_FILE: ${{ runner.temp }}/jepong-release.jks
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          gradle --no-daemon --stacktrace clean assembleRelease \
            -Pandroid.injected.signing.store.file="$STORE_FILE" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Verify release signature and package
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -s "$APK"
          unzip -t "$APK"
          "${ANDROID_SDK_ROOT}/build-tools/28.0.3/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -F "package: name='com.jepongdevxyz.idebuild'" apk-badging.txt
          "${ANDROID_SDK_ROOT}/build-tools/28.0.3/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" DevxyzIDE-v0.6.1-official-release.apk
          sha256sum DevxyzIDE-v0.6.1-official-release.apk > DevxyzIDE-v0.6.1-official-release.apk.sha256

      - name: Package exact verified source
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output=DevxyzIDE-v0.6.1-official-source.zip HEAD
          test -s DevxyzIDE-v0.6.1-official-source.zip
          unzip -t DevxyzIDE-v0.6.1-official-source.zip
          sha256sum DevxyzIDE-v0.6.1-official-source.zip > DevxyzIDE-v0.6.1-official-source.zip.sha256

      - name: Upload official release APK and source
        uses: actions/upload-artifact@v4
        with:
          name: DevxyzIDE-v0.6.1-official-release-bundle
          path: |
            DevxyzIDE-v0.6.1-official-release.apk
            DevxyzIDE-v0.6.1-official-release.apk.sha256
            DevxyzIDE-v0.6.1-official-source.zip
            DevxyzIDE-v0.6.1-official-source.zip.sha256
            apk-badging.txt
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/jepong-release.jks"

# Official release verification trigger metadata.
