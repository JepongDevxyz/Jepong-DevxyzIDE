name: DevxyzIDE Device Install Verification

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  api19_compatibility:
    name: Verify API 19 compatibility contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17 for Android SDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install build SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-29" "build-tools;29.0.3"

      - name: Set up JDK 8 for legacy Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle 4.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.6'

      - name: Build APK and verify API 19 metadata
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace clean assembleDebug
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          "${ANDROID_SDK_ROOT}/build-tools/29.0.3/aapt" dump badging "$APK" | tee api19-apk-badging.txt
          grep -F "package: name='com.jepongdevxyz.idebuild' versionCode='7' versionName='0.6.1-device-install'" api19-apk-badging.txt
          grep -F "sdkVersion:'19'" api19-apk-badging.txt
          grep -F "targetSdkVersion:'29'" api19-apk-badging.txt
          grep -F "launchable-activity: name='com.jepongdevxyz.idebuild.SplashActivity'" api19-apk-badging.txt

      - name: Upload API 19 compatibility evidence
        uses: actions/upload-artifact@v4
        with:
          name: DevxyzIDE-api19-compatibility
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            api19-apk-badging.txt
          if-no-files-found: error
          retention-days: 15

  signed_api29_install:
    name: Build signed APK and verify API 29 install
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17 for Android SDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install build SDK and API 29 emulator image
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-29" "build-tools;29.0.3" "system-images;android-29;google_apis;x86_64"

      - name: Set up JDK 8 for legacy Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle 4.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.6'

      - name: Build and sign exact user-delivery APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace clean assembleDebug
          RAW="app/build/outputs/apk/debug/app-debug.apk"
          SIGNED_APK="app/build/outputs/apk/debug/DevxyzIDE-v0.6.1-installable.apk"
          KEYSTORE="${RUNNER_TEMP}/devxyz-device-install.jks"
          export DEVXYZ_CI_KS_PASS="$(openssl rand -hex 16)"
          keytool -genkeypair -keystore "$KEYSTORE" \
            -storepass:env DEVXYZ_CI_KS_PASS -keypass:env DEVXYZ_CI_KS_PASS \
            -alias devxyz-device -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=DevxyzIDE Device Verification,O=Jepong Devxyz,C=PH"
          "${ANDROID_SDK_ROOT}/build-tools/29.0.3/apksigner" sign \
            --ks "$KEYSTORE" --ks-key-alias devxyz-device \
            --ks-pass env:DEVXYZ_CI_KS_PASS --key-pass env:DEVXYZ_CI_KS_PASS \
            --out "$SIGNED_APK" "$RAW"
          "${ANDROID_SDK_ROOT}/build-tools/29.0.3/apksigner" verify --verbose --print-certs "$SIGNED_APK"
          "${ANDROID_SDK_ROOT}/build-tools/29.0.3/aapt" dump badging "$SIGNED_APK" | tee device-apk-badging.txt
          grep -F "package: name='com.jepongdevxyz.idebuild' versionCode='7' versionName='0.6.1-device-install'" device-apk-badging.txt
          grep -F "sdkVersion:'19'" device-apk-badging.txt
          grep -F "targetSdkVersion:'29'" device-apk-badging.txt
          test -s "$SIGNED_APK"
          unzip -t "$SIGNED_APK"
          rm -f "$KEYSTORE"
          unset DEVXYZ_CI_KS_PASS

      - name: Install exact signed APK on API 29 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -no-metrics
          script: |
            set -euo pipefail
            SIGNED_APK="app/build/outputs/apk/debug/DevxyzIDE-v0.6.1-installable.apk"
            PACKAGE="com.jepongdevxyz.idebuild"
            ACTIVITY="com.jepongdevxyz.idebuild.SplashActivity"
            test -s "$SIGNED_APK"
            adb wait-for-device
            adb shell getprop ro.build.version.sdk | tee api29-device-sdk.txt
            adb uninstall "$PACKAGE" >/dev/null 2>&1 || true
            adb install "$SIGNED_APK" | tee api29-install.txt
            adb shell pm path "$PACKAGE" | tee api29-package-path.txt
            adb shell dumpsys package "$PACKAGE" | grep -F "versionName=0.6.1-device-install" | tee api29-version.txt
            adb shell am start -W -n "$PACKAGE/$ACTIVITY" | tee api29-launch.txt
            grep -F "Status: ok" api29-launch.txt
            grep -F "Activity: $PACKAGE/$ACTIVITY" api29-launch.txt
            sleep 5
            PID="$(adb shell pidof "$PACKAGE" | tr -d '\r' || true)"
            test -n "$PID"
            printf '%s\n' "$PID" | tee api29-pid.txt

      - name: Upload API 29 diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DevxyzIDE-api29-failure-diagnostics
          path: |
            device-apk-badging.txt
            api29-device-sdk.txt
            api29-install.txt
            api29-package-path.txt
            api29-version.txt
            api29-launch.txt
            api29-pid.txt
          if-no-files-found: warn
          retention-days: 15

      - name: Upload exact verified APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DevxyzIDE-v0.6.1-api29-installable
          path: |
            app/build/outputs/apk/debug/DevxyzIDE-v0.6.1-installable.apk
            device-apk-badging.txt
            api29-install.txt
            api29-package-path.txt
            api29-version.txt
            api29-launch.txt
            api29-pid.txt
          if-no-files-found: error
          retention-days: 15
