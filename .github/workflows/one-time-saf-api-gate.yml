name: One-time SAF API gate repair

on:
  push:
    branches:
      - feature/devxyzide-01-foundation
    paths:
      - .github/workflows/one-time-saf-api-gate.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/devxyzide-01-foundation
          fetch-depth: 0
      - name: Repair SAF picker source safely
        shell: python {0}
        run: |
          from pathlib import Path
          import re
          p = Path('app/src/main/java/com/jepongdevxyz/idebuild/MainActivity.java')
          s = p.read_text()
          if 'import android.os.Build;' not in s:
              s = s.replace('import android.os.Bundle;\n', 'import android.os.Build;\nimport android.os.Bundle;\n', 1)
          pattern = r'    private void startFolderPicker\(\) \{.*?\n    private void chooseToolchainPack'
          method = '''    private void startFolderPicker() {
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                  Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT_TREE);
                  intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION);
                  startActivityForResult(intent, REQUEST_IMPORT_FOLDER);
              } else {
                  appendConsole("\\nFolder import requires Android 5.0 or newer. ZIP import remains available.");
              }
          }

          private void chooseToolchainPack'''
          s, count = re.subn(pattern, lambda m: method, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('startFolderPicker region not found')
          p.write_text(s)
          Path('.github/workflows/one-time-saf-api-gate.yml').unlink()
      - name: Verify Java source contract
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('app/src/main/java/com/jepongdevxyz/idebuild/MainActivity.java').read_text()
          assert 'import android.os.Build;' in s
          assert 'Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP' in s
          assert 'appendConsole("\\nFolder import requires Android 5.0 or newer. ZIP import remains available.");' in s
          assert 'appendConsole("\nFolder' not in s
          PY
          python host-tests/import_ui_contract_test.py
      - name: Commit repaired source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: compile-safe API21 SAF import guard'
          git push origin HEAD:feature/devxyzide-01-foundation
