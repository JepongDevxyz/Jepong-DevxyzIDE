name: DevxyzIDE Android Runtime Packs

on:
  workflow_dispatch:
  push:
    branches:
      - feature/modern-runtime-packs
    paths:
      - 'tools/runtime-builder/**'
      - 'tools/runtime/stamp_bootstrap.py'
      - '.github/workflows/android-runtime-packs.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate configuration and unit tests
        run: |
          cd tools/runtime-builder
          python3 -m unittest -v test_validate_config.py test_toolchain_properties.py test_bootstrap_contract.py test_manifest.py test_upstream_source_overrides.py
          python3 validate-config.py config/runtime-pack.properties

  gradle-pack:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build verified Gradle 8.9 pack
        run: bash tools/runtime-builder/assemble-gradle-pack.sh
      - name: Verify Gradle archive structure
        run: |
          unzip -t tools/runtime-builder/out/gradle/gradle-8.9.devxyz-toolchain.zip
          unzip -l tools/runtime-builder/out/gradle/gradle-8.9.devxyz-toolchain.zip | grep 'toolchains/gradle-8.9/bin/gradle'
      - uses: actions/upload-artifact@v4
        with:
          name: devxyz-gradle-8.9-pack
          path: tools/runtime-builder/out/gradle/gradle-8.9.devxyz-toolchain.zip
          if-no-files-found: error

  sdk-pack:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build Android SDK 35 platform pack
        run: bash tools/runtime-builder/assemble-android-sdk-pack.sh
      - name: Verify SDK archive structure
        run: |
          unzip -t tools/runtime-builder/out/android-sdk/android-sdk-35.devxyz-toolchain.zip
          unzip -l tools/runtime-builder/out/android-sdk/android-sdk-35.devxyz-toolchain.zip | grep 'toolchains/android-sdk/platforms/android-35/android.jar'
          if unzip -l tools/runtime-builder/out/android-sdk/android-sdk-35.devxyz-toolchain.zip | grep -E 'build-tools/.*/aapt2$'; then
            echo 'Desktop aapt2 must not be packed' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: devxyz-android-sdk-35-pack
          path: tools/runtime-builder/out/android-sdk/android-sdk-35.devxyz-toolchain.zip
          if-no-files-found: error

  bootstrap-aarch64:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install native package builder prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl wget zip unzip xz-utils tar rsync python3 gpg autopoint
          sudo mkdir -p /data
          sudo chown -R "$(id -u):$(id -g)" /data
          java -version
          test -x "$JAVA_HOME/bin/java"
          test -w /data
          docker --version
      - name: Build DevxyzIDE ARM64 bootstrap
        run: |
          mkdir -p tools/runtime-builder/out/logs
          set -o pipefail
          bash tools/runtime-builder/build-bootstrap.sh 2>&1 | tee tools/runtime-builder/out/logs/bootstrap-aarch64.log
      - name: Verify stamped bootstrap contract
        run: python3 tools/runtime-builder/test_bootstrap_contract.py tools/runtime-builder/out/bootstrap/devxyz-bootstrap-aarch64.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: devxyz-runtime-bootstrap-build-log
          path: tools/runtime-builder/out/logs/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: devxyz-runtime-bootstrap-aarch64
          path: tools/runtime-builder/out/bootstrap/devxyz-bootstrap-aarch64.zip
          if-no-files-found: error

  manifest:
    needs: [gradle-pack, sdk-pack, bootstrap-aarch64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: devxyz-gradle-8.9-pack
          path: tools/runtime-builder/out/final
      - uses: actions/download-artifact@v4
        with:
          name: devxyz-android-sdk-35-pack
          path: tools/runtime-builder/out/final
      - uses: actions/download-artifact@v4
        with:
          name: devxyz-runtime-bootstrap-aarch64
          path: tools/runtime-builder/out/final
      - name: Generate immutable manifest and checksums
        run: |
          cd tools/runtime-builder
          python3 generate-manifest.py --out out/runtime-manifest.properties out/final/devxyz-bootstrap-aarch64.zip out/final/gradle-8.9.devxyz-toolchain.zip out/final/android-sdk-35.devxyz-toolchain.zip
          while read -r sha file; do
            file="${file#* }"
            file="${file# }"
            actual="$(sha256sum "out/final/$file" | awk '{print $1}')"
            test "$sha" = "$actual"
          done < out/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: devxyz-runtime-manifest
          path: |
            tools/runtime-builder/out/runtime-manifest.properties
            tools/runtime-builder/out/SHA256SUMS
          if-no-files-found: error
