name: DevxyzIDE Full Android Verification

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build APK with Android SDK 28
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17 for Android SDK tools
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-28" \
            "build-tools;28.0.3"

      - name: Set up JDK 8 for legacy Gradle and AGP
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle 4.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.6'

      - name: Show tool versions
        shell: bash
        run: |
          java -version
          gradle --version
          adb version

      - name: Run host and runtime compatibility tests
        shell: bash
        run: sh host-tests/run.sh

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace clean assembleDebug 2>&1 | tee gradle-build.log

      - name: Upload Gradle diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DevxyzIDE-gradle-build-log
          path: gradle-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Verify APK exists and ZIP structure is valid
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          "${ANDROID_SDK_ROOT}/build-tools/28.0.3/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -F "package: name='com.jepongdevxyz.idebuild'" apk-badging.txt

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: DevxyzIDE-v0.6-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-badging.txt
          if-no-files-found: error
          retention-days: 14

  emulator:
    name: Install and launch on Android emulator
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17 for Android SDK tools
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: DevxyzIDE-v0.6-debug-apk
          path: verified-artifact

      - name: Boot API 28 emulator, install APK, and launch DevxyzIDE
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -e
            test -s "$(find verified-artifact -type f -name 'app-debug.apk' -print -quit)"
            echo "Installing APK from: $(find verified-artifact -type f -name 'app-debug.apk' -print -quit)"
            adb wait-for-device
            adb install -r "$(find verified-artifact -type f -name 'app-debug.apk' -print -quit)"
            adb shell pm list packages | grep -F "package:com.jepongdevxyz.idebuild"
            adb shell monkey -p com.jepongdevxyz.idebuild -c android.intent.category.LAUNCHER 1
            sleep 5
            adb shell dumpsys activity activities | grep -F "com.jepongdevxyz.idebuild"
            adb shell am force-stop com.jepongdevxyz.idebuild
