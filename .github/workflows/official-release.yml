name: DevxyzIDE Official Signed Release

on:
  workflow_dispatch:
  push:
    branches:
      - release-official-signed-apk
    paths:
      - '.github/workflows/official-release.yml'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-29' 'build-tools;29.0.3'

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.APK_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/jepong-release.jks"
          test -s "$RUNNER_TEMP/jepong-release.jks"

      - name: Build signed release APK
        env:
          STORE_FILE: ${{ runner.temp }}/jepong-release.jks
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleRelease \
            -Pandroid.injected.signing.store.file="$STORE_FILE" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Verify release signature
        run: |
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/29.0.3/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" DevxyzIDE-v0.6.1-official-release.apk
          sha256sum DevxyzIDE-v0.6.1-official-release.apk > DevxyzIDE-v0.6.1-official-release.apk.sha256

      - name: Upload official release APK
        uses: actions/upload-artifact@v4
        with:
          name: DevxyzIDE-v0.6.1-official-signed-release
          path: |
            DevxyzIDE-v0.6.1-official-release.apk
            DevxyzIDE-v0.6.1-official-release.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/jepong-release.jks"
