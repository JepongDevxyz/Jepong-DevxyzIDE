name: One-time import integration repair

on:
  push:
    branches:
      - feature/devxyzide-01-foundation
    paths:
      - .github/workflows/one-time-import-integration.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/devxyzide-01-foundation
      - name: Integrate unlimited atomic import controller
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('app/src/main/java/com/jepongdevxyz/idebuild/MainActivity.java')
          s = path.read_text()

          s2 = s.replace('    private static final long MAX_IMPORT_BYTES = 8L * 1024L * 1024L * 1024L;\n', '')
          s2 = s2.replace('    private static final int MAX_IMPORT_ENTRIES = 100000;\n', '')
          if s2 == s:
              raise SystemExit('Expected legacy import ceilings were not found')
          s = s2

          s = s.replace('    private static final int REQUEST_EXPORT_BACKUP = 5004;\n',
                        '    private static final int REQUEST_EXPORT_BACKUP = 5004;\n    private static final int REQUEST_IMPORT_FOLDER = 5005;\n')

          marker = '    private File lastBuiltApk;\n'
          replacement = marker + '    private ProjectImportController projectImportController;\n'
          if marker not in s:
              raise SystemExit('MainActivity field marker not found')
          s = s.replace(marker, replacement, 1)

          marker = '        fileList.setAdapter(fileAdapter);\n\n'
          controller = '''        projectImportController = new ProjectImportController(this, io, new ProjectImportController.Listener() {\n            @Override public File getProjectStorageDirectory() throws IOException { return projectStorageDirectory(); }\n            @Override public void onImportMessage(String message) { appendConsole(message); }\n            @Override public void onProjectImported(File projectRoot) { loadProject(projectRoot); }\n        });\n\n'''
          if marker not in s:
              raise SystemExit('Adapter marker not found')
          s = s.replace(marker, marker + controller, 1)

          old = '    private void chooseZip() { startPicker("application/zip", REQUEST_IMPORT_ZIP); }\n'
          new = '''    private void chooseZip() {\n        final String[] sources = new String[]{"ZIP archive", "Project folder"};\n        new AlertDialog.Builder(this)\n                .setTitle("Import Project")\n                .setItems(sources, new DialogInterface.OnClickListener() {\n                    @Override public void onClick(DialogInterface dialog, int which) {\n                        if (which == 0) startPicker("application/zip", REQUEST_IMPORT_ZIP);\n                        else startFolderPicker();\n                    }\n                })\n                .setNegativeButton("Cancel", null)\n                .show();\n    }\n\n    private void startFolderPicker() {\n        Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT_TREE);\n        intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION);\n        startActivityForResult(intent, REQUEST_IMPORT_FOLDER);\n    }\n'''
          if old not in s:
              raise SystemExit('chooseZip marker not found')
          s = s.replace(old, new, 1)

          old = '''        if (requestCode == REQUEST_IMPORT_ZIP) importZip(data.getData());\n        else if (requestCode == REQUEST_TOOLCHAIN_PACK) importToolchainPack(data.getData());\n'''
          new = '''        if (requestCode == REQUEST_IMPORT_ZIP) projectImportController.importZip(data.getData());\n        else if (requestCode == REQUEST_IMPORT_FOLDER) {\n            try {\n                getContentResolver().takePersistableUriPermission(data.getData(), Intent.FLAG_GRANT_READ_URI_PERMISSION);\n            } catch (SecurityException ignored) { }\n            projectImportController.importFolder(data.getData());\n        }\n        else if (requestCode == REQUEST_TOOLCHAIN_PACK) importToolchainPack(data.getData());\n'''
          if old not in s:
              raise SystemExit('onActivityResult import marker not found')
          s = s.replace(old, new, 1)

          pattern = re.compile(r'\n    private void importZip\(final Uri uri\) \{.*?\n    \}\n\n    private void loadProject\(File root\)', re.S)
          s, count = pattern.subn('\n    private void loadProject(File root)', s, count=1)
          if count != 1:
              raise SystemExit('Legacy importZip method not found exactly once')

          if 'MAX_IMPORT_BYTES' in s or 'MAX_IMPORT_ENTRIES' in s:
              raise SystemExit('Legacy application-defined project import ceiling remains')
          if 'SafeZip.extractProject(input, target' in s:
              raise SystemExit('Legacy direct-to-final ZIP extraction remains')

          path.write_text(s)

      - name: Verify import integration contract
        run: |
          grep -q 'ProjectImportController projectImportController' app/src/main/java/com/jepongdevxyz/idebuild/MainActivity.java
          grep -q 'projectImportController.importZip' app/src/main/java/com/jepongdevxyz/idebuild/MainActivity.java
          grep -q 'projectImportController.importFolder' app/src/main/java/com/jepongdevxyz/idebuild/MainActivity.java
          ! grep -q 'MAX_IMPORT_BYTES' app/src/main/java/com/jepongdevxyz/idebuild/MainActivity.java
          ! grep -q 'MAX_IMPORT_ENTRIES' app/src/main/java/com/jepongdevxyz/idebuild/MainActivity.java
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/jepongdevxyz/idebuild/MainActivity.java
          git commit -m 'fix: route project imports through atomic streaming controller'
          git push origin HEAD:feature/devxyzide-01-foundation
