name: DevxyzIDE Full Android Verification
on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: gradle }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Lint
        run: gradle :app:lintDebug --stacktrace
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify package and APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging app/build/outputs/apk/debug/app-debug.apk | grep "package: name='com.jepongdevxyz.idebuild'"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with: { name: DevxyzIDE-verified-debug-apk, path: app/build/outputs/apk/debug/app-debug.apk }
