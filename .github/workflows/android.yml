name: DevxyzIDE Full Android Verification
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      ui_match_confirmed:
        description: "Only set after reviewing the app screens against the approved reference"
        type: boolean
        required: true
        default: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: gradle }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Check API-qualified theme resources
        run: python3 scripts/test_resource_api_compat.py
      - name: Lint
        run: gradle :app:lintDebug --stacktrace
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify package and APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging app/build/outputs/apk/debug/app-debug.apk | grep "package: name='com.jepongdevxyz.idebuild'"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - name: Stop Gradle daemons before starting the emulator
        run: gradle --stop
      - name: Capture real screens on Android emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -no-metrics
          disable-animations: true
          script: python3 scripts/capture_reference_screens.py
      - name: Upload UI review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DevxyzIDE-ui-reference-review
          path: artifacts/ui-reference/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Publish debug APK artifact after design approval
        if: github.event_name == 'workflow_dispatch' && inputs.ui_match_confirmed == true
        uses: actions/upload-artifact@v4
        with: { name: DevxyzIDE-verified-debug-apk, path: app/build/outputs/apk/debug/app-debug.apk }
